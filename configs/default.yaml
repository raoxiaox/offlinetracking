# STWO 默认配置。阈值类参数的初值只用于跑通流程，正式使用前运行 scripts/calibrate.py 从标定集得到。
# 章节号对应设计文档《2D 离线轨迹重连（STWO）工程基线方案》。
exp_name: default
seed: 0

pipeline:
  link: true                # false = A0，不做重连

cmc:                        # §3.1
  enabled: true
  source: auto              # auto: 有 cmc.npz 用它，否则从帧估计；frames；file；none
  max_corners: 400
  quality_level: 0.01
  min_distance: 7
  ransac_thresh: 3.0
  n_min: 20
  hull_alpha: 0.3
  box_expand: 0.1

quality:                    # §3.2 / §3.3
  s_min: 8.0                # sqrt(wh) 像素
  s_max: 64.0
  border_margin: 4.0        # 像素
  trunc_value: 0.3
  use_blur: false

gating:                     # §4
  tau_max: 3.0              # 秒，消融时扫描 0.5/1/2/3
  class_groups: [[car, van]]
  v_max: {default: 3.0}     # 每秒最多移动几个目标尺度，按类别；标定覆盖
  g0: {default: 1.0}
  rho_min: 0.2
  cmc_fail_relax: 2.0
  calib_margin: 1.25        # 标定得到的 v_max、g0 再乘的安全系数（门控以召回为准）
  cannot_link: []           # [[src, dst], ...]

motion:                     # §5
  K: 8                      # 拟合用的端点观测数
  velocity: lsq             # lsq（多帧加权拟合）| twoframe（两帧差分，消融 A1–A3）
  two_sided: true           # false = 只用前向（A1、A2）
  space: image              # image | ground（阶段 4，需要相机地面单应和 ego 位姿）
  ground_scale_m: 4.0       # ground 模式下的目标尺度（米）
  kappa_m: 2.0              # ψ 截断上限，标定覆盖
  tau0: 1.0                 # Q_m 随缺口衰减的时间常数（秒）
  consistency_max: 1.5      # |ẽ_f − ẽ_b| 超过即标记 motion_inconsistent，标定覆盖
  cost: psi                 # psi（截断线性）| nll（阶段 4，§5.6）
  sigma_obs: 0.05           # NLL：观测噪声（目标尺度单位）
  trace_max: 4.0            # NLL：tr(Σ_f) 上限，超过只能进复核
  chi2_min_frac: 0.85       # NLL 校准检查：正样本 d² ≤ 5.99 的比例下限

appearance:                 # §6
  enabled: true
  mode: set                 # set（代表帧集合距离）| lastfirst（末帧 vs 首帧，A5 对照）
  window_sec: 2.0
  k: 5
  k_min: 2
  q_min: 0.05
  min_sep: 3
  beta0: 6.0                # C_a = 1 − σ(β0 + β1·d_set)，标定覆盖
  beta1: -15.0
  delta_a: 0.15             # |d_set − d_proto| 超过即 app_inconsistent，标定覆盖
  purity_max: 0.5           # 轨迹前后半原型距离上限，标定覆盖
  veto_q: 0.05              # 外观否决：Q_a ≥ veto_q 且 C_a ≥ veto_ca 时该边不参与连接（§6.5）
  veto_ca: 0.99             # 标定为正样本 C_a 的 99.5 分位，漏召 ≤ 0.5%

scale:                      # §7.1
  enabled: true
  kappa_s: 0.3

fusion:                     # §7.3 / §7.5
  mode: adaptive            # adaptive | fixed | logreg
  w_m: 0.5
  w_a: 0.4
  w_s: 0.1
  w_t: 0.1
  logreg: null              # 阶段 4：标定得到的系数 {coef: [...], intercept: x}

competition:                # §8
  enabled: true             # false 时贪心不要求 MNN / margin（A1–A7）
  delta_m: 0.1              # 竞争者记录范围 & 贪心要求的最小歧义度

association:                # §9
  solver: hungarian         # hungarian | greedy
  theta_link: 0.5           # 代价低于它才值得连；logreg 模式为 0
  eta_border: 0.0

decision:                   # §10
  theta_auto: 0.3
  theta_review: 0.7
  delta_auto: 0.1
  e_min: 0.3
  precision_target: 0.98       # 由标注团队可接受的错误率决定；样本量要足以验证它
  precision_pseudo_fp: 1     # 标定 θ_auto 时额外计入的伪错误数，防止小样本把精度估高
  blocking_flags: [app_veto, cmc_fail, app_inconsistent, motion_inconsistent, impure, motion_uncertain, low_motion]
  interp: true
  g_fill_sec: 3.0

eval:
  iou_thr: 0.5
  purity_thr: 0.8
  gap_buckets: [0.0, 0.5, 1.0, 2.0, 3.0]
